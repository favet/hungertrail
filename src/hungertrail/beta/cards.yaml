# Hunger Trail BETA event cards.
#
# Card:    id, kind (event|gamemaker|feast|betrayal|finale), place (events only: a list of
#          stream|rocks|ridge|horn|open: where in the arena you meet it), days [min, max], emoji,
#          text, requires {ally, partner, nemesis, min_remaining, max_remaining, max_health},
#          target (any|girl|boy|nemesis: a living tribute the card is about; {Target} in text, and
#          the one who dies if you kill)
# Option:  label, hint, tag (safe|bold|hide), need {item|any|perk (district)|ally|supplies}
#          then EITHER  text + effects
#          OR           roll {base, mods: [combat|escape|stealth|forage|swim]} + success + fail
# Effects: health supplies (+/-), add/remove (item or list), kill (n), sponsor (a silver
#          parachute: what you need most), gift (a random found item),
#          ally (dies|lost|joins_partner), die (cause), cause (if this outcome kills you),
#          next (card id, or "duel"), win, partner_dies
# Nothing is hidden: every effect shows on the option as a chip.
# Text can use {ally} {partner} {district} {Target} {target} {Nemesis} {nemesis} {remaining}.

- id: smoke_east
  kind: event
  place:
  - ridge
  days:
  - 2
  - 7
  emoji: 🔥
  text: Smoke rises to the east. Someone has a campfire - or wants you to think so.
  options:
  - label: Follow the smoke
    hint: A camp means supplies. A trap means Careers.
    tag: bold
    roll:
      base: 50
      mods:
      - stealth
    success:
      text: A careless tribute's camp, abandoned for water. You take everything.
      effects:
        supplies: 3
    fail:
      text: The fire was bait. The Careers were waiting.
      effects:
        health: -40
        cause: a Career ambush
  - label: Go the other way
    tag: safe
    text: You head west. The crowd yawns.
    effects: {}
- id: cloudy_stream
  kind: event
  place:
  - stream
  days:
  - 2
  - 8
  emoji: 💧
  text: You find a stream. The water is cloudy and smells of rot.
  options:
  - label: Purify it and drink
    need:
      item: iodine
    tag: safe
    text: Thirty minutes for the iodine to work. Then all you can drink.
    effects:
      supplies: 3
  - label: Drink it anyway
    hint: Oregon Trail veterans know how this goes.
    tag: bold
    roll:
      base: 55
      mods:
      - forage
    success:
      text: It tastes awful. You keep it down.
      effects:
        supplies: 3
    fail:
      text: You have dysentery.
      effects:
        health: -35
        cause: dysentery
        supplies: 2
  - label: Keep looking
    tag: safe
    text: You walk on, thirsty.
    effects: {}
- id: berries
  kind: event
  place:
  - ridge
  days:
  - 2
  - 8
  emoji: 🫐
  text: A bush heavy with small dark berries. They look a lot like nightlock.
  options:
  - label: Pick the safe ones
    need:
      perk: 11
    tag: safe
    text: You know the difference. Half are blueberries. You eat well.
    effects:
      supplies: 2
  - label: Eat a handful
    hint: If they're nightlock, you're dead before you swallow.
    tag: bold
    roll:
      base: 50
      mods: []
    success:
      text: Blueberries. Your heart slows back down.
      effects:
        supplies: 2
    fail:
      effects:
        die: nightlock berries
      text: Nightlock.
  - label: Leave them
    tag: safe
    text: You leave them for someone hungrier.
    effects: {}
- id: tracker_jackers
  kind: event
  place:
  - ridge
  days:
  - 2
  - 7
  emoji: 🐝
  text: A nest of tracker jackers hangs from the branch above you. Below, the Career pack is asleep around their
    fire.
  options:
  - label: Saw the branch
    need:
      any:
      - knife
      - axe
      - spear
    hint: The nest will fall on them. Probably not on you.
    tag: bold
    roll:
      base: 60
      mods:
      - stealth
    success:
      text: The nest drops. The screaming starts. You're stung twice and run with a bow you didn't have before.
      effects:
        kill: 2
        health: -15
        add: bow
        sponsor: true
    fail:
      text: The nest drops early. Onto you.
      effects:
        health: -55
        cause: tracker jackers
  - label: Raid their camp while they sleep
    hint: Their supplies are right there. So are they.
    tag: bold
    roll:
      base: 45
      mods:
      - stealth
    success:
      text: You tiptoe out with food, water and a spear. Nobody stirs.
      effects:
        add: spear
        supplies: 3
        sponsor: true
    fail:
      text: A Career sleeps lighter than the rest.
      effects:
        health: -45
        cause: the Career pack
  - label: Back away quietly
    tag: safe
    roll:
      base: 80
      mods:
      - stealth
    success:
      text: You back away without a sound.
    fail:
      text: One of them follows you. Then all of them do.
      effects:
        health: -25
        cause: tracker jackers
- id: high_river
  kind: event
  place:
  - stream
  days:
  - 2
  - 8
  emoji: 🌊
  text: A river blocks your way. It rained last night and the water is running high and fast.
  options:
  - label: Ford the river
    hint: About three feet deep. Oregon Trail says that's bad.
    tag: bold
    roll:
      base: 55
      mods:
      - swim
    success:
      text: Cold to the bone, but across.
      effects: {}
    fail:
      text: The current takes your feet. You lose supplies and nearly yourself.
      effects:
        health: -35
        cause: drowned fording a river
        supplies: -2
  - label: Float across on a rope line
    need:
      item: rope
    tag: safe
    roll:
      base: 90
      mods:
      - swim
    success:
      text: You tie off to a tree and pull yourself across. Textbook.
    fail:
      text: The knot slips. You make it, without your food.
      effects:
        supplies: -2
  - label: Wait for the water to drop
    tag: hide
    text: You wait a day. The water drops. The crowd changes the channel.
    effects:
      supplies: -1
