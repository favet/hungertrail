services:
  - type: web
    name: hungertrail
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn hungertrail.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Keep uv's Python inside the project so it survives from build to runtime.
      - key: UV_PYTHON_INSTALL_DIR
        value: .uv-python
      - key: HT_SEED_SECRET
        generateValue: true
      - key: HT_TIMEZONE
        value: America/Los_Angeles
      - key: HT_LAUNCH_DATE
        value: 2026-11-23
