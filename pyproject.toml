[project]
name = "hungertrail"
version = "0.1.0"
description = "The Hunger Games meets The Oregon Trail: a daily survival game."
authors = [
    { name = "favet", email = "justin@favet.net" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.4",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hungertrail = "hungertrail:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
